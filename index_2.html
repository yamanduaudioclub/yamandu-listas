<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema RRPP Yamandú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>

:root{
  --bg:#EEF0EF; --surface:#FFFFFF; --surface-2:#F7F8F7; --border:#D9DCDA;
  --ink:#1B1E22; --ink-muted:#5B6167; --ink-faint:#8A8F8C;
  --accent:#A66A1B; --accent-ink:#FFFFFF; --accent-soft:#F3E3CC; --accent-soft-ink:#7A4E13;
  --success:#2F8F55; --success-soft:#E1F1E6; --warning:#B15D1B; --warning-soft:#FBEADB;
  --critical:#C0392B; --critical-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(20,22,25,.06),0 10px 28px -14px rgba(20,22,25,.22);
  --radius:12px; --radius-sm:8px;
  --font-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --surface:#1D2027; --surface-2:#23262D; --border:#33373F;
    --ink:#EDEAE3; --ink-muted:#A0A5A9; --ink-faint:#6E7378;
    --accent:#D9A441; --accent-ink:#14161A; --accent-soft:#3A2E17; --accent-soft-ink:#EFC57C;
    --success:#5FB07A; --success-soft:#1C2E22; --warning:#E2914F; --warning-soft:#332312;
    --critical:#E2695F; --critical-soft:#341B18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1D2027; --surface-2:#23262D; --border:#33373F;
  --ink:#EDEAE3; --ink-muted:#A0A5A9; --ink-faint:#6E7378;
  --accent:#D9A441; --accent-ink:#14161A; --accent-soft:#3A2E17; --accent-soft-ink:#EFC57C;
  --success:#5FB07A; --success-soft:#1C2E22; --warning:#E2914F; --warning-soft:#332312;
  --critical:#E2695F; --critical-soft:#341B18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:700; text-wrap:balance; letter-spacing:-0.01em;}
a{color:inherit;}
button{font-family:inherit;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---- topbar & nav ---- */
.topbar{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); backdrop-filter:blur(6px);}
.topbar-inner{max-width:980px; margin:0 auto; padding:14px 16px 0;}
.brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .sub{color:var(--ink-faint); font-size:12px; text-transform:uppercase; letter-spacing:.08em;}
.logo-plate{display:inline-flex; align-items:center; justify-content:center; background:#15171B; border-radius:8px; padding:5px 12px; line-height:0; box-shadow:0 1px 2px rgba(0,0,0,.3);}
.logo-plate img{display:block; height:18px; width:auto;}
.logo-plate-lg{padding:16px 26px; border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.35);}
.logo-plate-lg img{height:42px;}
.save-status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-faint); white-space:nowrap;}
.save-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint);}
.save-dot.live{background:var(--success);}
.save-dot.local{background:var(--warning);}
.save-dot.saving{background:var(--accent); animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid transparent; background:none; color:var(--ink-muted); font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
.tab:hover{color:var(--ink);}
.tab.active{background:var(--ink); color:var(--bg);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tab.active{background:var(--accent); color:var(--accent-ink);} }
:root[data-theme="dark"] .tab.active{background:var(--accent); color:var(--accent-ink);}

.view{max-width:980px; margin:0 auto; padding:20px 16px 64px;}
.view-head{margin-bottom:18px;}
.view-head h1{font-size:24px; margin:0 0 4px;}
.view-head p{margin:0; color:var(--ink-muted); font-size:13.5px;}

/* ---- cards & layout ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.card + .card{margin-top:14px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.grid{display:grid; gap:12px;}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat{padding:14px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--border);}
.stat .num{font-family:var(--font-mono); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat .label{color:var(--ink-muted); font-size:12.5px; margin-top:2px;}
.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; margin:0 0 10px;}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}

/* ---- pills ---- */
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;}
.pill-general{background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);}
.pill-vip{background:var(--accent-soft); color:var(--accent-soft-ink);}
.pill-socio{background:var(--accent-soft); color:var(--accent-soft-ink);}
.pill-success{background:var(--success-soft); color:var(--success);}
.pill-warning{background:var(--warning-soft); color:var(--warning);}
.pill-critical{background:var(--critical-soft); color:var(--critical);}
.pill-muted{background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--border);}
.dot-toggle{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* ---- table ---- */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px;}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap;}
th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
td.num,th.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

/* ---- forms ---- */
form{display:flex; flex-direction:column; gap:12px;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-muted);}
.field-row{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=time],select{
  font-family:inherit; font-size:14.5px; padding:10px 12px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--ink); width:100%;
}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; cursor:pointer;}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-ghost{background:none; border-color:transparent; color:var(--ink-muted);}
.btn-ghost:hover{color:var(--ink); background:var(--surface-2);}
.btn-danger{color:var(--critical); border-color:var(--critical-soft);}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn[disabled]{opacity:.55; cursor:default;}
details.pagos summary{cursor:pointer; color:var(--accent); font-size:12.5px; font-weight:600;}
.pagos-list{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
.pago-item{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; padding:6px 10px; background:var(--surface-2); border-radius:var(--radius-sm);}

.empty{padding:28px 16px; text-align:center; color:var(--ink-faint); font-size:13.5px;}

/* ---- banner / flash ---- */
.banner-wrap{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50; width:min(92vw,480px);}
.banner{padding:12px 16px; border-radius:var(--radius); font-size:13.5px; font-weight:500; box-shadow:var(--shadow); display:flex; gap:10px; align-items:flex-start;}
.banner-success{background:var(--success-soft); color:var(--success); border:1px solid var(--success);}
.banner-critical{background:var(--critical-soft); color:var(--critical); border:1px solid var(--critical);}
.banner-info{background:var(--surface); color:var(--ink); border:1px solid var(--border);}

/* ---- invite (guest) screen ---- */
.invite-page{min-height:100vh; background:
  radial-gradient(1200px 500px at 50% -10%, var(--accent-soft), transparent 60%), var(--bg);
  display:flex; flex-direction:column; align-items:center; padding:36px 16px 60px;}
.invite-wrap{width:100%; max-width:460px;}
.invite-brand{display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:22px;}
.invite-brand .tag{color:var(--ink-muted); font-size:13px;}
.evento-card{border:1px dashed var(--border); border-radius:var(--radius); padding:16px; background:var(--surface); margin-bottom:16px;}
.evento-card .nombre{font-family:var(--font-display); font-weight:700; font-size:19px;}
.evento-card .fecha{color:var(--ink-muted); font-size:13.5px; margin-top:2px;}
.evento-card .corte{margin-top:8px; font-size:12.5px; color:var(--warning); font-weight:600;}
.ticket{border:1px dashed var(--accent); border-radius:var(--radius); padding:20px; background:var(--surface); position:relative;}
.ticket .code{font-family:var(--font-mono); letter-spacing:.15em; color:var(--ink-faint); font-size:12px; text-transform:uppercase;}
.ticket h2{margin:6px 0 2px; font-size:22px;}
.ticket .meta{color:var(--ink-muted); font-size:13.5px; margin-top:8px; display:flex; flex-direction:column; gap:3px;}
.foot-link{margin-top:26px; text-align:center;}
.foot-link a{font-size:12px; color:var(--ink-faint); text-decoration:underline;}

@media (max-width:520px){
  .brand-row{flex-wrap:wrap;}
  th,td{padding:9px 8px;}
}

</style>
</head>

/* ---------- data loading ---------- */
function loadPublicListas(){
  publicListasAttempted = true;
  invitarLoading = true; invitarError=''; render();
  Promise.all([
    SB.from('rrpps').select('*').eq('activo', true).order('nombre'),
    SB.from('eventos').select('*').eq('activo', true).order('fecha')
  ]).then(function(results){
    var rrppsRes = results[0], eventosRes = results[1];
    if(rrppsRes.error || eventosRes.error){
      invitarError = 'No pudimos cargar el formulario. Probá de nuevo en un momento.';
    } else {
      sbRrpps = rrppsRes.data.map(mapSbRrpp);
      sbEventos = eventosRes.data.map(mapSbEvento);
      publicLoaded = true;
    }
    invitarLoading = false;
    render();
  }).catch(function(){ invitarLoading=false; invitarError='No pudimos cargar el formulario. Probá de nuevo en un momento.'; render(); });
}

// opts.silent: background refresh (polling / tab-focus). Doesn't show the
// full-screen "Cargando…" gate, doesn't surface load errors (just retries next
// cycle), and skips the re-render if the admin is mid-typing in a form so an
// autorefresh never wipes an unsaved field.
function loadAdminData(opts){
  if(!isAuthed()) return;
  var silent = !!(opts && opts.silent);
  sbLoadAttempted = true;
  if(!silent){ sbLoading = true; sbLoadError=''; render(); }
  Promise.all([
    SB.from('rrpps').select('*').order('nombre'),
    SB.from('eventos').select('*').order('fecha'),
    SB.from('invitados').select('*').order('creado_en', {ascending:false}),
    SB.from('socios').select('*').order('apellido'),
    SB.from('planes').select('*').order('precio')
  ]).then(function(results){
    var rrppsRes=results[0], eventosRes=results[1], invitadosRes=results[2], sociosRes=results[3], planesRes=results[4];
    if(rrppsRes.error || eventosRes.error || invitadosRes.error || sociosRes.error || planesRes.error){
      if(!silent){ sbLoadError = 'No pudimos cargar los datos del panel. Tocá para reintentar.'; }
    } else {
      sbRrpps = rrppsRes.data.map(mapSbRrpp);
      sbEventos = eventosRes.data.map(mapSbEvento);
      sbInvitados = invitadosRes.data.map(mapSbInvitado);
      sbSocios = sociosRes.data.map(mapSbSocio);
      sbPlanes = planesRes.data.map(mapSbPlan);
      sbLoaded = true;
      publicLoaded = true;
    }
    if(!silent){ sbLoading = false; }
    var activeTag = document.activeElement && document.activeElement.tagName;
    var isTyping = activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA';
    if(!silent || !isTyping){ render(); }
  }).catch(function(){ if(!silent){ sbLoading=false; sbLoadError='No pudimos cargar los datos del panel. Tocá para reintentar.'; render(); } });
}

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtMoney(n){ n = Number(n)||0; return '$' + n.toLocaleString('es-AR'); }
function fmtDate(iso){ try{ var d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'short'}); }catch(e){ return iso; } }
function fmtDateTime(iso){ try{ var d = new Date(iso); return d.toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function monthKey(d){ d = d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function planById(id){ return sbPlanes.find(function(p){return p.id===id;}); }
function rrppById(id){ return sbRrpps.find(function(r){return r.id===id;}); }
function eventoById(id){ return sbEventos.find(function(e){return e.id===id;}); }
function cutoffDate(evento){
  var parts = evento.horaCorte.split(':'); var h = parseInt(parts[0],10);
  var d = new Date(evento.fecha+'T'+evento.horaCorte+':00');
  if(h < 6){ d.setDate(d.getDate()+1); }
  return d;
}
function waLink(phone, text){ return 'https://wa.me/'+encodeURIComponent(phone||'')+'?text='+encodeURIComponent(text); }
function baseUrl(){ return location.origin + location.pathname; }

/* ---------- routing ---------- */
var ADMIN_ROUTES = ['panel','rrpps','socios','puerta','eventos','login'];

function getRoute(){
  var hash = (location.hash||'').replace(/^#/,'');
  var bits = hash.split('?');
  if(bits[0] === 'invitar' || !hash){
    return {route:'invitar', params:new URLSearchParams(bits[1]||'')};
  }
  if(isAuthed()){
    var route = ADMIN_ROUTES.indexOf(bits[0])!==-1 && bits[0]!=='login' ? bits[0] : 'panel';
    return {route:route, params:new URLSearchParams(bits[1]||'')};
  }
  if(ADMIN_ROUTES.indexOf(bits[0]) !== -1){
    return {route:'login', params:new URLSearchParams()};
  }
  return {route:'invitar', params:new URLSearchParams()};
}

/* ---------- mutations ---------- */
function showBanner(kind, text){
  var wrap = document.getElementById('banner-wrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="banner banner-'+kind+'" role="status">'+esc(text)+'</div>';
  clearTimeout(showBanner._t);
  showBanner._t = setTimeout(function(){ wrap.innerHTML=''; }, 5000);
}

function toggleIngreso(id){
  var inv = sbInvitados.find(function(x){return x.id===id;});
  if(!inv) return;
  var next = !inv.ingreso;
  var nextEn = next ? new Date().toISOString() : null;
  SB.from('invitados').update({ingreso:next, ingreso_en:nextEn}).eq('id', id).then(function(res){
    if(res.error){ showBanner('critical','No se pudo actualizar el ingreso.'); return; }
    inv.ingreso = next;
    inv.ingresoEn = nextEn;
    render();
  });
}
function addRrpp(data){
  SB.from('rrpps').insert({nombre:data.nombre, codigo:data.codigo.toUpperCase(), telefono:data.telefono||''}).select().single().then(function(res){

    sbRrpps.push(mapSbRrpp(res.data));
    showBanner('success','RRPP agregado.');
    render();
  });
}

/* ---------- commission math ---------- */
function comisionPago(pago, precio){
  if(pago.status !== 'pagado') return 0;
  return Math.round(precio * (pago.tipo==='alta' ? 0.15 : 0.10));
}
function socioComisiones(socio){
  var plan = planById(socio.planId);
  var precio = plan ? plan.precio : 0;
  var historico = 0, pendiente = 0;
  socio.pagos.forEach(function(p){
    var c = comisionPago(p, precio);
    historico += c;
    if(c>0 && !p.liquidado) pendiente += c;
  });
  return {historico:historico, pendiente:pendiente, precio:precio};
}

/* ---------- rendering: shell ---------- */
function render(){
  var r = getRoute();
  var app = document.getElementById('app');
  if(r.route === 'invitar'){
    if(!sbLoaded && !publicLoaded && !invitarLoading && !publicListasAttempted && SB){ loadPublicListas(); }
    app.innerHTML = renderInvitar(r.params);
  } else if(r.route === 'login'){
    app.innerHTML = renderLogin();
  } else {
    if(isAuthed() && !sbLoaded && !sbLoading && !sbLoadAttempted && SB){ loadAdminData(); }
    var body;
    if(isAuthed() && !sbLoaded){
      body = sbLoadError
        ? '<div class="card" style="border-color:var(--critical);"><p style="color:var(--critical);margin:0 0 10px;">'+esc(sbLoadError)+'</p><button class="btn btn-sm" data-action="sb-retry">Reintentar</button></div>'
        : '<div class="card"><div class="empty">Cargando datos…</div></div>';
    } else {
      body = renderView(r.route);
    }
    app.innerHTML = renderTopbar(r.route) + '<div class="view">' + body + '</div>';
  }
}

function renderTopbar(route){
  var tabs = [['panel','Panel'],['puerta','Puerta'],['socios','Socios'],['rrpps','RRPP'],['eventos','Eventos']];
  var html = '<div class="topbar"><div class="topbar-inner">';
  html += '<div class="brand-row"><div class="brand"><span class="logo-plate"><img src="'+LOGO_SRC+'" alt="'+esc(ORG_NAME)+'" width="98" height="20"></span><span class="sub">RRPP</span></div>';
  html += '<div class="row" style="gap:10px;align-items:center;"><button class="btn btn-ghost btn-sm" data-action="refresh-data" title="Volver a cargar los datos ahora">⟳ Actualizar</button><button class="btn btn-ghost btn-sm" data-action="logout">Salir</button></div></div>';
  html += '<nav class="tabs">';
  tabs.forEach(function(t){
    html += '<button class="tab'+(route===t[0]?' active':'')+'" data-action="nav" data-href="#'+t[0]+'">'+t[1]+'</button>';
  });
  html += '</nav></div></div>';
  return html;
}

function renderView(route){
  if(route==='puerta') return renderPuerta();
  if(route==='socios') return renderSocios();
  if(route==='rrpps') return renderRrpps();
  if(route==='eventos') return renderEventos();
  return renderPanel();
}

/* ---------- Panel ---------- */
function renderPanel(){
  var activos = sbRrpps.filter(function(r){return r.activo;});
  var proximos = sbEventos.filter(function(e){return e.activo;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});
  var socActivos = sbSocios.filter(function(s){return s.estado==='activo';});
  var pendienteTotal = 0;
  sbSocios.forEach(function(s){ pendienteTotal += socioComisiones(s).pendiente; });

  var html = '<div class="view-head"><h1>Panel</h1><p>Estado general del sistema de listas y membresías.</p></div>';
  html += '<div class="grid grid-stats">';
  html += stat(activos.length, 'RRPP activos');
  html += stat(proximos.length, 'Eventos activos');
  html += stat(socActivos.length, 'Socios activos');
  html += stat(fmtMoney(pendienteTotal), 'Comisión por liquidar');
  html += '</div>';

  html += '<div class="card"><h3 class="section-title">Próximos eventos</h3>';
  if(!proximos.length){ html += '<div class="empty">No hay eventos activos. Cargá uno en la pestaña Eventos.</div>'; }
  else {
    proximos.forEach(function(e){
      var gen = sbInvitados.filter(function(i){return i.eventoId===e.id && i.tipo==='general';}).length;
      var vip = sbInvitados.filter(function(i){return i.eventoId===e.id && i.tipo==='vip';}).length;
      html += '<div class="row-between" style="padding:10px 0;border-top:1px solid var(--border);">';
      html += '<div><strong>'+esc(e.nombre)+'</strong><div style="color:var(--ink-muted);font-size:12.5px;">'+fmtDate(e.fecha)+' · corte '+esc(e.horaCorte)+' hs</div></div>';
      html += '<div class="row"><span class="pill pill-general">'+gen+' en lista</span><span class="pill pill-vip">'+vip+' VIP</span></div>';
      html += '</div>';
    });
  }
  html += '</div>';

  html += '<div class="card"><h3 class="section-title">Comisión pendiente por RRPP</h3>';
  var rrppsConSocios = sbRrpps.filter(function(r){ return sbSocios.some(function(s){return s.rrppId===r.id;}); });
  if(!rrppsConSocios.length){ html += '<div class="empty">Todavía no hay socios cargados.</div>'; }
  else {
    rrppsConSocios.forEach(function(r){
      var socios = sbSocios.filter(function(s){return s.rrppId===r.id;});
      var porMes = {}; var total = 0;
      socios.forEach(function(s){
        var plan = planById(s.planId); var precio = plan?plan.precio:0;
        s.pagos.forEach(function(p){
          var monto = comisionPago(p, precio);
          if(monto>0 && !p.liquidado){ porMes[p.mesKey] = (porMes[p.mesKey]||0) + monto; total += monto; }
        });
      });
      var meses = Object.keys(porMes).sort();
      html += '<div class="row-between" style="padding:10px 0;border-top:1px solid var(--border);">';
      html += '<div><strong>'+esc(r.nombre)+'</strong>'+(meses.length?'<div style="font-size:12px;color:var(--ink-muted);">'+meses.map(function(mk){return esc(mk)+': '+fmtMoney(porMes[mk]);}).join(' · ')+'</div>':'<div style="font-size:12px;color:var(--ink-muted);">Sin comisión pendiente</div>')+'</div>';
      html += '<span class="pill '+(total?'pill-warning':'pill-success')+'">'+fmtMoney(total)+'</span>';
      html += '</div>';
    });
  }
  html += '</div>';

  html += '<div class="card"><h3 class="section-title">Link para compartir (autogestión de invitados)</h3>';
  html += '<p style="color:var(--ink-muted);font-size:13.5px;margin:0 0 10px;">Un único link universal: quien lo abre elige fecha y RRPP. Cada RRPP también tiene su link personal en la pestaña RRPP, que precarga su nombre. Este es el único link que se comparte con clientes.</p>';
  html += linkRow(baseUrl()+'#invitar');
  html += '</div>';

  html += '<div class="card" style="border-color:var(--warning);"><h3 class="section-title" style="color:var(--warning);">Link del panel interno — no compartir</h3>';
  html += '<p style="color:var(--ink-muted);font-size:13.5px;margin:0 0 10px;">Pide mail y contraseña reales antes de mostrar cualquier dato. Para dar acceso a alguien de tu equipo, creale un usuario en Supabase → Authentication → Users.</p>';
  html += linkRow(baseUrl()+'#panel');
  html += '</div>';

  html += '<div class="card" style="border-color:var(--critical);"><h3 class="section-title" style="color:var(--critical);">Zona de peligro</h3>';
  html += '<p style="color:var(--ink-muted);font-size:13.5px;margin:0 0 10px;">Borra todos los eventos, invitados, socios y RRPP cargados, para arrancar de cero con datos reales. No se puede deshacer.</p>';
  html += '<button class="btn btn-sm btn-danger" data-action="reset-all">Vaciar todo el panel</button>';
  html += '</div>';
  return html;
}

/* ---------- events (delegation) ---------- */
function onSubmit(e){
  var form = e.target.closest('form[data-action]');
  if(!form) return;
  e.preventDefault();
  var action = form.dataset.action;
  var fd = new FormData(form);
  var data = {}; fd.forEach(function(v,k){ data[k]=v; });

  if(action==='invite-nuevo'){
    invitarSubmitting = true; inviteSubmitError=''; render();
    SB.from('invitados').insert({nombre:data.nombre, apellido:data.apellido, mail:data.mail, telefono:data.telefono, evento_id:data.eventoId, rrpp_id:data.rrppId||null, tipo:'general'}).then(function(res){
      invitarSubmitting = false;
      if(res.error){
        inviteSubmitError = 'No pudimos confirmar tu lugar. Probá de nuevo en un momento.';
        render();
        return;
      }
      sessionStorage.setItem('yam_invite_done', JSON.stringify({nombre:data.nombre, apellido:data.apellido, eventoId:data.eventoId, rrppId:data.rrppId}));
      render();
    }).catch(function(){ invitarSubmitting=false; inviteSubmitError='No pudimos confirmar tu lugar. Probá de nuevo en un momento.'; render(); });
    return;
  }
  if(action==='puerta-nuevo'){
    SB.from('invitados').insert({nombre:data.nombre, apellido:data.apellido, mail:data.mail||'', telefono:data.telefono||'', evento_id:data.eventoId, rrpp_id:data.rrppId||null, tipo:data.tipo||'general'}).select().single().then(function(res){
      if(res.error){ showBanner('critical','No se pudo agregar a la lista.'); return; }
      sbInvitados.unshift(mapSbInvitado(res.data));
      showBanner('success', data.nombre+' agregado a la lista.');
      render();
    });
    form.reset();
    return;
  }
  if(action==='rrpp-nuevo'){ addRrpp(data); form.reset(); return; }
  if(action==='evento-nuevo'){ addEvento(data); form.reset(); return; }
  if(action==='socio-nuevo'){ addSocio(data); form.reset(); return; }
  if(action==='rrpp-editar'){ editRrpp(form.dataset.id, data); return; }
  if(action==='socio-editar'){ editSocio(form.dataset.id, data); return; }
  if(action==='admin-login'){
    loginSubmitting = true; authError=''; render();
    SB.auth.signInWithPassword({email:data.email, password:data.password}).then(function(res){
      loginSubmitting = false;
      if(res.error){
        authError = 'Mail o contraseña incorrectos.';
        render();
      } else {
        authSession = res.data.session;
        authError = '';
        location.hash = 'panel';
        render();
        loadAdminData();
        startPolling();
      }
    }).catch(function(err){ loginSubmitting=false; authError='No pudimos conectar (' + (err && err.message ? err.message : 'error de red') + '). Probá de nuevo.'; render(); });
    return;
  }
}

function onClick(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  if(action==='nav'){
    e.preventDefault();
    location.hash = el.dataset.href;
    render();
    return;
  }
  if(action==='toggle-ingreso'){ toggleIngreso(el.dataset.id); return; }
  if(action==='toggle-rrpp-activo'){ toggleRrppActivo(el.dataset.id); return; }
  if(action==='toggle-evento-activo'){ toggleEventoActivo(el.dataset.id); return; }
  if(action==='registrar-renovacion'){ registrarRenovacion(el.dataset.id); return; }
  if(action==='toggle-socio-cancelado'){ toggleSocioCancelado(el.dataset.id); return; }
  if(action==='toggle-liquidado'){ toggleLiquidado(el.dataset.id, el.dataset.mes); return; }
  if(action==='toggle-pago-status'){ togglePagoStatus(el.dataset.id, el.dataset.mes); return; }
  if(action==='invite-again'){ sessionStorage.removeItem('yam_invite_done'); inviteSubmitError=''; render(); return; }
  if(action==='rrpp-editar-abrir'){ editingRrppId = el.dataset.id; render(); return; }
  if(action==='rrpp-editar-cancelar'){ editingRrppId = null; render(); return; }
  if(action==='rrpp-eliminar'){ deleteRrpp(el.dataset.id); return; }
  if(action==='socio-editar-abrir'){ editingSocioId = el.dataset.id; render(); return; }
  if(action==='socio-editar-cancelar'){ editingSocioId = null; render(); return; }
  if(action==='socio-eliminar'){ deleteSocio(el.dataset.id); return; }
  if(action==='evento-eliminar'){ deleteEvento(el.dataset.id); return; }
  if(action==='reset-all'){ resetAll(); return; }
  if(action==='logout'){
    stopPolling();
    SB.auth.signOut().then(function(){
      authSession = null;
      sbLoaded = false;
      sbLoadAttempted = false;
      location.hash = 'invitar';
      render();
    });
    return;
  }
  if(action==='sb-retry'){ loadAdminData(); return; }
  if(action==='refresh-data'){ loadAdminData(); return; }
  if(action==='invitar-retry'){ loadPublicListas(); return; }
  if(action==='copy-link'){
    var url = el.dataset.href;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ showBanner('success','Link copiado.'); }); }
    else { showBanner('info', url); }
    return;
  }
}
function onChange(e){
  var el = e.target;
  var action = el.dataset.action;
  if(!action) return;
  if(action==='door-evento'){ doorEventId = el.value; render(); return; }
  if(action==='socios-filtro'){ sociosFilter = el.value; render(); return; }
  if(action==='evento-corte'){ updateEventoCorte(el.dataset.id, el.value); return; }
  if(action==='plan-precio'){ updatePlanPrecio(el.dataset.id, el.value); return; }
}
function onInput(e){
  var el = e.target;
  if(el.dataset.action==='door-search'){ doorSearch = el.value; render(); var input=document.getElementById('door-search'); if(input){ input.focus(); input.setSelectionRange(input.value.length,input.value.length);} }
}

/* ---------- init ---------- */
// Background auto-refresh for the admin panel: without this, once loadAdminData()
// has run once, nothing tells this open tab that a guest signed up or another
// device changed something — the only way to see it was to log out and back in.
// Poll quietly every 15s while a tab is authenticated and visible, and catch up
// immediately when the tab regains focus (covers "I switched away and came back").
var POLL_MS = 15000;
var pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(function(){
    if(document.hidden) return;
    if(isAuthed()) loadAdminData({silent:true});
  }, POLL_MS);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && isAuthed()) loadAdminData({silent:true});
});

function init(){
  document.getElementById('app').addEventListener('submit', onSubmit);
  document.getElementById('app').addEventListener('click', onClick);
  document.getElementById('app').addEventListener('change', onChange);
  document.getElementById('app').addEventListener('input', onInput);
  window.addEventListener('hashchange', render);
  SB = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  render();
  SB.auth.getSession().then(function(res){
    authSession = (res.data && res.data.session) || null;
    authChecked = true;
    render();
    if(authSession) startPolling();
  }).catch(function(){ authChecked = true; render(); });
  SB.auth.onAuthStateChange(function(_event, session){
    authSession = session;
  });
}
init();
})();



</script>
